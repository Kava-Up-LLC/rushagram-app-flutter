name: rushagram_app
description: "Rushagram: the word of the day against the clock, on AppAmbit."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  appambit_sdk_flutter: ^1.2.1
  appambit_sdk_push_notifications: ^1.2.1
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/branding/

  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rubik-Bold.ttf
          weight: 700
        - asset: assets/fonts/Rubik-ExtraBold.ttf
          weight: 800

# App icon (approved logo, assets/branding/README.md). Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/branding/icon_master.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  adaptive_icon_background: "#ECEFF5"
  # The foreground already keeps the mark inside the 66 dp safe zone; the default 16% inset would shrink it twice.
  adaptive_icon_foreground_inset: 0

# Native splash. Run: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#ECEFF5"
  image: assets/branding/mark.png
  android_12:
    color: "#ECEFF5"
    image: assets/branding/icon_foreground.png
